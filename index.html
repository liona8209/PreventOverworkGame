<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過勞防護不心苦｜預防過勞大挑戰</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-start:#1e3c72;
    --bg-end:#2a5298;
    --low-color:#34d399;
    --high-color:#ff9457;
    --wrong-color:#ff6b6b;
    --ink:#f0f4ff;
    --sub-ink:#cfe0ff;
    --card-bg:#ffffff;
    --card-ink:#233044;
    --card-sub-ink:#5b6b83;
    --panel-bg:rgba(255,255,255,0.07);
    --panel-border:rgba(255,255,255,0.16);
    --shadow:0 10px 30px rgba(9,16,36,0.35);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
    background-attachment:fixed;
    padding:24px 16px 60px;
    -webkit-touch-callout:none;
    touch-action:pan-y pinch-zoom;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;}
  /* 排版順序：標題 -> 按鈕 -> 訊息 -> 題目卡 -> 頁尾 -> 合作單位 LOGO（桌面／手機一致） */
  header{order:1;}
  .controls{order:2;}
  #message{order:3;}
  .quiz-panel{order:4;}
  footer{order:5;}
  .partner-links{order:6;}

  header{text-align:center;margin-bottom:22px;}
  header .badge{
    display:inline-block;
    background:linear-gradient(135deg, rgba(255,255,255,0.28), rgba(255,255,255,0.08));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:#fff;font-weight:700;font-size:14px;padding:6px 18px;border-radius:999px;
    letter-spacing:2px;margin-bottom:12px;
    border:1px solid rgba(255,255,255,0.4);
    box-shadow:0 8px 24px rgba(9,16,36,0.25), inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -6px 12px rgba(255,255,255,0.06);
    text-shadow:0 1px 3px rgba(9,16,36,0.35);
  }
  h1{
    font-size:clamp(26px,4.5vw,40px);
    margin:0 0 10px;
    font-weight:900;
    color:#fff;
    text-shadow:0 2px 12px rgba(9,16,36,0.35);
  }
  .subtitle{color:var(--sub-ink);font-size:17px;margin:0 auto 4px;max-width:640px;line-height:1.7;}
  .subtitle strong{color:var(--ink);}

  .controls{display:flex;justify-content:center;gap:14px;margin:26px 0 14px;flex-wrap:wrap;}
  button,.btn-link{
    font-family:inherit;font-size:17px;font-weight:700;padding:13px 20px;border-radius:999px;
    border:none;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
    width:160px;white-space:nowrap;text-align:center;
  }
  button:active,.btn-link:active{transform:translateY(1px) scale(.98);}
  button:disabled{cursor:not-allowed;}
  #resetBtn{background:linear-gradient(135deg,#ffe259,#ffa751);color:#1e2a4a;border:none;}
  #nextLevelBtn{background:linear-gradient(90deg,#a78bfa,#f472b6);color:#fff;}

  #message{
    max-width:640px;margin:0 auto 22px;text-align:center;font-size:16.5px;font-weight:700;
    padding:14px 18px;border-radius:14px;min-height:20px;transition:opacity .2s;
  }
  #message.hidden{display:none;}
  #message.success{background:#eafaf1;color:#166534;border:2px solid #bdeccb;}
  #message.error{background:#fde4e4;color:#991b1b;border:2px solid #f7bcbc;}

  /* ---- 題目卡（玻璃感面板） ---- */
  .quiz-panel{
    background:var(--panel-bg);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--panel-border);
    border-radius:24px;
    padding:28px 24px 30px;
    box-shadow:var(--shadow);
    text-align:center;
  }

  .screen[hidden]{display:none;}

  .screen-icon{font-size:44px;margin-bottom:6px;}
  .screen h2{margin:0 0 10px;font-size:24px;color:#fff;}
  .screen p{margin:0 auto 22px;max-width:480px;color:var(--sub-ink);font-size:15.5px;line-height:1.7;}

  .cta-btn{
    font-family:inherit;font-weight:700;font-size:17px;border:none;border-radius:999px;
    cursor:pointer;box-shadow:var(--shadow);transition:transform .12s, box-shadow .12s;
    padding:15px 36px;
  }
  .cta-btn:active{transform:translateY(1px) scale(.98);}
  #startBtn{background:linear-gradient(90deg,#22d3ee,#34d399);color:#08221b;}

  .stat-row{
    display:flex;justify-content:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;
  }
  .stat-chip{
    background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.2);
    border-radius:14px;padding:8px 20px;min-width:120px;
  }
  .stat-chip .stat-label{display:block;font-size:12px;color:var(--sub-ink);letter-spacing:1px;margin-bottom:2px;}
  .stat-chip .stat-value{display:block;font-size:18px;font-weight:900;color:#fff;}

  .question-img{
    width:100%;max-width:400px;aspect-ratio:1/1;object-fit:cover;border-radius:16px;
    box-shadow:0 8px 20px rgba(9,16,36,.4);border:3px solid rgba(255,255,255,0.6);
    margin:0 auto 18px;display:block;background:#f0f2f6;
  }
  .question-title{margin:0 0 8px;font-size:22px;font-weight:900;color:#fff;}
  .question-desc{margin:0 0 24px;font-size:15.5px;color:var(--sub-ink);line-height:1.6;}

  .answer-buttons{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .answer-btn{
    font-family:inherit;font-weight:900;font-size:17px;border-radius:18px;
    padding:20px 22px;flex:1 1 200px;max-width:240px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1.5px solid rgba(255,255,255,0.4);
    box-shadow:0 10px 26px rgba(9,16,36,.4), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -8px 14px rgba(255,255,255,.05);
    text-shadow:0 1px 3px rgba(9,16,36,.35);
    transition:transform .15s, box-shadow .2s, border-color .2s, background .2s, filter .2s, opacity .2s;
  }
  .answer-btn:hover{transform:translateY(-3px);}
  .answer-btn:active{transform:translateY(1px) scale(.98);}
  .answer-btn.low{border-color:rgba(52,211,153,.55);}
  .answer-btn.high{border-color:rgba(255,148,87,.55);}
  .answer-btn:disabled{cursor:not-allowed;}
  .answer-btn.dim{opacity:.35;}
  .answer-btn.correct{
    background:linear-gradient(135deg, rgba(52,211,153,.35), rgba(52,211,153,.12));
    border-color:#34d399;
    box-shadow:0 0 0 4px rgba(52,211,153,.4), 0 10px 26px rgba(9,16,36,.4), inset 0 1px 0 rgba(255,255,255,.5);
    opacity:1;
  }
  .answer-btn.wrong{
    background:linear-gradient(135deg, rgba(255,107,107,.35), rgba(255,107,107,.12));
    border-color:var(--wrong-color);
    box-shadow:0 0 0 4px rgba(255,107,107,.4), 0 10px 26px rgba(9,16,36,.4), inset 0 1px 0 rgba(255,255,255,.5);
    opacity:1;
  }

  footer{text-align:center;color:var(--sub-ink);opacity:.65;font-size:13px;margin-top:34px;}

  .partner-links{
    display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;margin-top:20px;
  }
  .partner-logo{
    width:64px;height:64px;border-radius:50%;overflow:hidden;background:#fff;
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .partner-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .partner-logo:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 10px 20px rgba(9,16,36,.4);}

  @media (max-width:640px){
    .quiz-panel{padding:22px 16px 24px;border-radius:20px;}
    .question-img{max-width:300px;}
    .question-title{font-size:19px;}
    .answer-btn{flex:1 1 45%;padding:18px 12px;font-size:15px;}
    button,.btn-link{min-width:0;flex:1 1 140px;padding:13px 14px;}
    .cta-btn{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">衛教互動小遊戲</span>
    <h1>過勞防護不心苦</h1>
    <p class="subtitle">
      《過勞防護不心苦》預防過勞大挑戰<br>
      看情境圖卡，判斷這是「減少過勞風險」還是「增加過勞風險」！
    </p>
  </header>

  <div class="controls">
    <button id="resetBtn">🔄 重新開始</button>
    <a id="nextLevelBtn" class="btn-link" href="https://liona8209.github.io/OccupationMemoryGame/" target="_blank" rel="noopener">➡️ 下一關</a>
  </div>

  <div id="message" class="hidden"></div>

  <div class="quiz-panel">
    <!-- 開始畫面 -->
    <div class="screen" id="startScreen">
      <div class="screen-icon">🚀</div>
      <h2>準備好了嗎？</h2>
      <p>接下來會看到 8 組情境圖卡，請判斷每個情境是「減少過勞風險」還是「增加過勞風險」！答對越多，代表你越懂得如何預防過勞。</p>
      <button class="cta-btn" id="startBtn">🚀 開始挑戰</button>
    </div>

    <!-- 作答畫面 -->
    <div class="screen" id="quizScreen" hidden>
      <div class="stat-row">
        <div class="stat-chip">
          <span class="stat-label">進度</span>
          <span class="stat-value" id="progressText">第 1 題 / 共 8 題</span>
        </div>
        <div class="stat-chip">
          <span class="stat-label">得分</span>
          <span class="stat-value" id="scoreValue">0</span>
        </div>
      </div>

      <img class="question-img" id="questionImg" src="" alt="">
      <h3 class="question-title" id="questionTitle"></h3>
      <p class="question-desc" id="questionDesc"></p>

      <div class="answer-buttons" id="answerButtons">
        <button class="answer-btn low" id="lowAnswerBtn" data-answer="low">🟢 減少過勞風險</button>
        <button class="answer-btn high" id="highAnswerBtn" data-answer="high">🔴 增加過勞風險</button>
      </div>
    </div>

    <!-- 結算畫面 -->
    <div class="screen" id="endScreen" hidden>
      <div class="screen-icon">🎉</div>
      <h2>遊戲結束！</h2>
      <p id="finalScoreText">你答對了 8 / 8 題！</p>
    </div>
  </div>

  <footer>過勞防護不心苦｜過勞預防衛教宣導 — 情境判斷小遊戲</footer>

  <div class="partner-links">
    <a href="https://org.vghks.gov.tw/omd/Default.aspx" target="_blank" rel="noopener" class="partner-logo" aria-label="高榮職醫科">
      <img src="Image/高榮職醫科.png" alt="高榮職醫科">
    </a>
    <a href="https://www.facebook.com/ksvghccom" target="_blank" rel="noopener" class="partner-logo" aria-label="高榮診治中心 Facebook">
      <img src="Image/高榮診治中心FB.png" alt="高榮診治中心 Facebook">
    </a>
    <a href="https://www.instagram.com/ksvgh_ccom" target="_blank" rel="noopener" class="partner-logo" aria-label="高榮診治中心 Instagram">
      <img src="Image/高榮診治中心IG.png" alt="高榮診治中心 Instagram">
    </a>
  </div>
</div>

<script>
(function(){
  "use strict";

  const QUESTIONS_DATA = [
    { title:"健康管理",       desc:"定期健康檢查與追蹤。",                     answer:"low",  img:"Image/健康管理.png" },
    { title:"身體活動",       desc:"規律適度運動。",                            answer:"low",  img:"Image/身體活動.png" },
    { title:"充足休息",       desc:"適當休息。",                                answer:"low",  img:"Image/充足休息.png" },
    { title:"壓力調適",       desc:"適度調節工作壓力。",                        answer:"low",  img:"Image/壓力調適.png" },
    { title:"極端壓力工作",   desc:"極度緊張、精神負荷高的工作。",              answer:"high", img:"Image/極端壓力工作.png" },
    { title:"特殊工時與班別", desc:"不規律的工作、輪班或夜班等特殊作業環境。",  answer:"high", img:"Image/特殊工時與班別.png" },
    { title:"不良作業環境",   desc:"異常高、低溫環境或充斥噪音等特殊作業環境。",answer:"high", img:"Image/不良作業環境.png" },
    { title:"過重負荷",       desc:"長期工作過重或短期工作超過負荷。",          answer:"high", img:"Image/過重負荷.png" }
  ];

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  let QUESTIONS = QUESTIONS_DATA;

  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const endScreen = document.getElementById('endScreen');

  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lowAnswerBtn = document.getElementById('lowAnswerBtn');
  const highAnswerBtn = document.getElementById('highAnswerBtn');

  const progressText = document.getElementById('progressText');
  const scoreValue = document.getElementById('scoreValue');
  const questionImg = document.getElementById('questionImg');
  const questionTitle = document.getElementById('questionTitle');
  const questionDesc = document.getElementById('questionDesc');
  const finalScoreText = document.getElementById('finalScoreText');
  const messageEl = document.getElementById('message');

  const AUTO_ADVANCE_DELAY = 1400;

  let currentIndex = 0;
  let score = 0;
  let answered = false;
  let advanceTimer = null;

  function clearAdvanceTimer(){
    if(advanceTimer){
      clearTimeout(advanceTimer);
      advanceTimer = null;
    }
  }

  function clearMessage(){
    messageEl.className = 'hidden';
    messageEl.textContent = '';
  }

  function showMessage(text, type){
    messageEl.className = type;
    messageEl.textContent = text;
  }

  function showScreen(screen){
    [startScreen, quizScreen, endScreen].forEach(s => { s.hidden = (s !== screen); });
  }

  function goToStart(){
    clearAdvanceTimer();
    currentIndex = 0;
    score = 0;
    answered = false;
    clearMessage();
    showScreen(startScreen);
  }

  function renderQuestion(){
    const q = QUESTIONS[currentIndex];
    answered = false;
    clearMessage();

    progressText.textContent = '第 ' + (currentIndex + 1) + ' 題 / 共 ' + QUESTIONS.length + ' 題';
    scoreValue.textContent = score;
    questionImg.src = q.img;
    questionImg.alt = q.title;
    questionTitle.textContent = q.title;
    questionDesc.textContent = q.desc;

    [lowAnswerBtn, highAnswerBtn].forEach(btn=>{
      btn.disabled = false;
      btn.classList.remove('correct','wrong','dim');
    });
  }

  function startQuiz(){
    clearAdvanceTimer();
    QUESTIONS = shuffle(QUESTIONS_DATA);
    currentIndex = 0;
    score = 0;
    showScreen(quizScreen);
    renderQuestion();
  }

  function handleAnswer(choice){
    if(answered) return;
    answered = true;

    const q = QUESTIONS[currentIndex];
    const isCorrect = choice === q.answer;
    if(isCorrect) score++;

    [lowAnswerBtn, highAnswerBtn].forEach(btn=>{
      btn.disabled = true;
      const btnAnswer = btn.dataset.answer;
      if(btnAnswer === q.answer){
        btn.classList.add('correct');
      }else if(btnAnswer === choice){
        btn.classList.add('wrong');
      }else{
        btn.classList.add('dim');
      }
    });

    scoreValue.textContent = score;
    showMessage(isCorrect ? '✅ 答對了！' : '❌ 答錯囉！', isCorrect ? 'success' : 'error');

    clearAdvanceTimer();
    advanceTimer = setTimeout(nextQuestion, AUTO_ADVANCE_DELAY);
  }

  function nextQuestion(){
    clearAdvanceTimer();
    currentIndex++;
    if(currentIndex >= QUESTIONS.length){
      showEnd();
    }else{
      renderQuestion();
    }
  }

  function showEnd(){
    clearMessage();
    finalScoreText.textContent = '你答對了 ' + score + ' / ' + QUESTIONS.length + ' 題！';
    showScreen(endScreen);
  }

  startBtn.addEventListener('click', startQuiz);
  resetBtn.addEventListener('click', goToStart);
  lowAnswerBtn.addEventListener('click', function(){ handleAnswer('low'); });
  highAnswerBtn.addEventListener('click', function(){ handleAnswer('high'); });

  goToStart();
})();
</script>
</body>
</html>
